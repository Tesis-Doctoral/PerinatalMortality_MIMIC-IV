<svg viewBox="0 0 1280 873" role="img" aria-label="Diagrama del framework: cuatro bloques (definir y auditar, fijar el punto de predicción, construir, comprobar y actuar) con tres puertas de decisión, el ensamble apilado dentro de E8, la rama de viabilidad cuando hay pocos eventos y la etapa de estrategia de prevención E10." xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block;font-family:inherit"><style>text{font-family:"Segoe UI",Arial,sans-serif}.bg{fill:#FFFFFF}.f-box{fill:#FFFFFF;stroke:#B9C4CF;stroke-width:1.2}.f-block{fill:#F7F9FA;stroke:#0A6A74;stroke-width:1.6}.f-chip{fill:#EEF2F5;stroke:#B9C4CF;stroke-width:1}.f-gate{fill:#FFFFFF;stroke:#0A6A74;stroke-width:1.6}.f-ficha{fill:#DCEEF0;stroke:none}.f-e10{fill:#DCEEF0;stroke:#0A6A74;stroke-width:1.6;stroke-dasharray:6 4}.f-feas{fill:#FBEACB;stroke:#8F5200;stroke-width:1.4}.f-pill{fill:#FFFFFF;stroke:#0A6A74;stroke-width:1}.f-id{font:600 10.5px Consolas,monospace;fill:#0A6A74}.f-t{font-size:13px;font-weight:600;fill:#15202A}.f-s{font-size:11px;fill:#566574}.f-sb{font-size:11.5px;font-weight:700;fill:#15202A}.f-band{font:600 11px Consolas,monospace;letter-spacing:.08em;fill:#566574}.f-warn{font-size:11.5px;font-weight:600;fill:#8F5200}.f-accent{font-size:11.5px;font-weight:600;fill:#0A6A74}.f-ink{font-size:12.5px;font-weight:600;fill:#15202A}.f-dot{fill:#0A6A74}.f-sq{fill:#566574}.f-adapt{fill:#EEF2F5;stroke:#B9C4CF;stroke-width:1}.f-rule{stroke:#D3DAE1;stroke-width:1}.f-line{stroke:#566574;stroke-width:1.5}.f-line-acc{stroke:#0A6A74;stroke-width:1.5;stroke-dasharray:2 3}.f-line-warn{stroke:#8F5200;stroke-width:1.6;stroke-dasharray:6 4}.f-head{fill:#566574}.f-head-warn{fill:#8F5200}.f-head-acc{fill:#0A6A74}</style><rect width="1280" height="873" class="bg"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" class="f-head"/></marker><marker id="ahw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" class="f-head-warn"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" class="f-head-acc"/></marker></defs><rect x="40" y="12" width="1200" height="52" rx="6" class="f-ficha"/><circle cx="60" cy="30" r="4.5" class="f-dot"/><text x="74" y="34" class="f-ink" text-anchor="start">Ficha del desenlace: lo único que cambia entre morbilidad materna, muerte perinatal antes del nacimiento y neonatal</text><text x="74" y="53" class="f-s" text-anchor="start">población · definición del evento · punto de predicción · bloques propios de predictores · set de sensibilidad · acciones de la entidad · conteos esperados. Un punto marca la etapa donde entra cada uno.</text><rect x="40" y="70" width="1200" height="52" rx="6" class="f-adapt"/><rect x="56" y="84" width="9" height="9" class="f-sq"/><text x="74" y="92" class="f-ink" text-anchor="start">Adaptador de datos: convierte un dataset en la tabla del contrato que lee el método (MIMIC-IV hoy; el neonatal y las entidades de salud tendrán el suyo)</text><text x="74" y="111" class="f-s" text-anchor="start">unidad · grupo · tiempo cero · punto de predicción · etiquetas · predictores con su momento de disponibilidad. Un cuadrado marca las etapas que dependen de él.</text><g transform="translate(0,58)"><text x="40" y="90" class="f-band" text-anchor="start">1 · DEFINIR Y AUDITAR</text><path d="M40 97 H712" class="f-rule" fill="none"/><text x="748" y="90" class="f-band" text-anchor="start">2 · FIJAR EL PUNTO DE PREDICCIÓN</text><path d="M748 97 H1134" class="f-rule" fill="none"/><rect x="40" y="106" width="122" height="76" rx="6" class="f-box"/><text x="50" y="123" class="f-id" text-anchor="start">E0</text><text x="50" y="142" class="f-t" text-anchor="start">Gobernanza y</text><text x="50" y="157" class="f-t" text-anchor="start">configuración</text><rect x="182" y="106" width="122" height="76" rx="6" class="f-box"/><text x="192" y="123" class="f-id" text-anchor="start">E1</text><text x="192" y="142" class="f-t" text-anchor="start">Universo y</text><text x="192" y="157" class="f-t" text-anchor="start">población</text><circle cx="294" cy="116" r="4.5" class="f-dot"/><rect x="276" y="112" width="8" height="8" class="f-sq"/><rect x="324" y="106" width="122" height="76" rx="6" class="f-box"/><text x="334" y="123" class="f-id" text-anchor="start">E2</text><text x="334" y="142" class="f-t" text-anchor="start">Definición</text><text x="334" y="157" class="f-t" text-anchor="start">del desenlace</text><circle cx="436" cy="116" r="4.5" class="f-dot"/><rect x="466" y="106" width="122" height="76" rx="6" class="f-box"/><text x="476" y="123" class="f-id" text-anchor="start">E3</text><text x="476" y="142" class="f-t" text-anchor="start">Auditoría</text><text x="476" y="157" class="f-t" text-anchor="start">de conteos</text><rect x="574" y="112" width="8" height="8" class="f-sq"/><path d="M626 144 L668 102 L710 144 L668 186 Z" class="f-gate"/><text x="668" y="149" class="f-id" text-anchor="middle">1</text><text x="668" y="204" class="f-sb" text-anchor="middle">Puerta 1</text><text x="668" y="217" class="f-s" text-anchor="middle">población, unidad,</text><text x="668" y="230" class="f-s" text-anchor="middle">definición (D3 a D5)</text><rect x="748" y="106" width="122" height="76" rx="6" class="f-box"/><text x="758" y="123" class="f-id" text-anchor="start">E4</text><text x="758" y="142" class="f-t" text-anchor="start">Unidad y</text><text x="758" y="157" class="f-t" text-anchor="start">solapamiento</text><rect x="856" y="112" width="8" height="8" class="f-sq"/><rect x="890" y="106" width="122" height="76" rx="6" class="f-box"/><text x="900" y="123" class="f-id" text-anchor="start">E5</text><text x="900" y="142" class="f-t" text-anchor="start">Punto de</text><text x="900" y="157" class="f-t" text-anchor="start">predicción</text><text x="900" y="172" class="f-t" text-anchor="start">y ventana</text><circle cx="1002" cy="116" r="4.5" class="f-dot"/><path d="M1050 144 L1092 102 L1134 144 L1092 186 Z" class="f-gate"/><text x="1092" y="149" class="f-id" text-anchor="middle">2</text><text x="1092" y="204" class="f-sb" text-anchor="middle">Puerta 2</text><text x="1092" y="217" class="f-s" text-anchor="middle">punto, ventana,</text><text x="1092" y="230" class="f-s" text-anchor="middle">estancias cortas</text><text x="1092" y="243" class="f-s" text-anchor="middle">(D6 a D8)</text><path d="M162 144 H181" class="f-line" fill="none" marker-end="url(#ah)"/><path d="M304 144 H323" class="f-line" fill="none" marker-end="url(#ah)"/><path d="M446 144 H465" class="f-line" fill="none" marker-end="url(#ah)"/><path d="M588 144 H625" class="f-line" fill="none" marker-end="url(#ah)"/><path d="M710 144 H747" class="f-line" fill="none" marker-end="url(#ah)"/><path d="M870 144 H889" class="f-line" fill="none" marker-end="url(#ah)"/><path d="M1012 144 H1049" class="f-line" fill="none" marker-end="url(#ah)"/><path d="M1134 144 H1172 V256 H22 V425 H39" class="f-line" fill="none" marker-end="url(#ah)"/><text x="40" y="282" class="f-band" text-anchor="start">3 · CONSTRUIR</text><path d="M40 289 H1240" class="f-rule" fill="none"/><rect x="40" y="387" width="122" height="76" rx="6" class="f-box"/><text x="50" y="404" class="f-id" text-anchor="start">E6</text><text x="50" y="423" class="f-t" text-anchor="start">Predictores</text><circle cx="152" cy="397" r="4.5" class="f-dot"/><rect x="134" y="393" width="8" height="8" class="f-sq"/><path d="M208 425 L250 383 L292 425 L250 467 Z" class="f-gate"/><text x="250" y="430" class="f-id" text-anchor="middle">E7</text><text x="250" y="346" class="f-sb" text-anchor="middle">Puerta 3</text><text x="250" y="359" class="f-s" text-anchor="middle">tamaño de muestra</text><text x="250" y="372" class="f-s" text-anchor="middle">(D12)</text><path d="M162 425 H207" class="f-line" fill="none" marker-end="url(#ah)"/><text x="339" y="410" class="f-accent" text-anchor="middle">eventos</text><text x="339" y="423" class="f-accent" text-anchor="middle">suficientes</text><path d="M292 435 H385" class="f-line" fill="none" marker-end="url(#ah)"/><rect x="386" y="300" width="854" height="266" rx="8" class="f-block"/><text x="406" y="324" class="f-id" text-anchor="start">E8</text><text x="430" y="324" class="f-ink" text-anchor="start">Modelado, validación y métricas</text><text x="406" y="342" class="f-s" text-anchor="start">Estrategia por defecto: ensamble apilado. Morbilidad materna: 445 eventos, modelo completo.</text><text x="406" y="364" class="f-s" text-anchor="start">Parte de entrenamiento de cada pliegue externo, agrupada por paciente</text><rect x="406" y="374" width="148" height="30" rx="5" class="f-chip"/><text x="480" y="393" class="f-t" text-anchor="middle">XGBoost</text><path d="M554 389 L605 441" class="f-line" fill="none" marker-end="url(#ah)"/><rect x="406" y="412" width="148" height="30" rx="5" class="f-chip"/><text x="480" y="431" class="f-t" text-anchor="middle">Árboles extra</text><path d="M554 427 L605 441" class="f-line" fill="none" marker-end="url(#ah)"/><rect x="406" y="450" width="148" height="30" rx="5" class="f-chip"/><text x="480" y="469" class="f-t" text-anchor="middle">Bosque aleatorio</text><path d="M554 465 L605 441" class="f-line" fill="none" marker-end="url(#ah)"/><rect x="406" y="488" width="148" height="30" rx="5" class="f-chip"/><text x="480" y="507" class="f-t" text-anchor="middle">Regresión logística</text><path d="M554 503 L605 441" class="f-line" fill="none" marker-end="url(#ah)"/><rect x="606" y="403" width="140" height="76" rx="6" class="f-box"/><text x="618" y="426" class="f-t" text-anchor="start">Predicciones fuera</text><text x="618" y="441" class="f-t" text-anchor="start">de muestra</text><text x="618" y="458" class="f-s" text-anchor="start">pliegues internos</text><rect x="786" y="403" width="120" height="76" rx="6" class="f-box"/><text x="798" y="436" class="f-t" text-anchor="start">Meta-aprendiz</text><text x="798" y="451" class="f-t" text-anchor="start">logístico</text><rect x="946" y="403" width="120" height="76" rx="6" class="f-box"/><text x="958" y="426" class="f-t" text-anchor="start">Recalibración</text><text x="958" y="441" class="f-t" text-anchor="start">de Platt</text><text x="958" y="458" class="f-s" text-anchor="start">en entrenamiento</text><rect x="1096" y="403" width="124" height="76" rx="6" class="f-box"/><text x="1108" y="423" class="f-t" text-anchor="start">Pliegue externo</text><text x="1108" y="438" class="f-t" text-anchor="start">de prueba</text><text x="1108" y="455" class="f-s" text-anchor="start">AUROC, AUPRC,</text><text x="1108" y="468" class="f-s" text-anchor="start">calibración</text><path d="M746 441 H785" class="f-line" fill="none" marker-end="url(#ah)"/><path d="M906 441 H945" class="f-line" fill="none" marker-end="url(#ah)"/><path d="M1066 441 H1095" class="f-line" fill="none" marker-end="url(#ah)"/><rect x="606" y="522" width="614" height="30" rx="15" class="f-pill"/><text x="913" y="541" class="f-accent" text-anchor="middle">Comparación pareada con la regresión logística y con el mejor modelo base (bootstrap por paciente)</text><path d="M480 518 V537 H605" class="f-line-acc" fill="none" marker-end="url(#aha)"/><path d="M1006 479 V521" class="f-line-acc" fill="none" marker-end="url(#aha)"/><text x="238" y="487" class="f-s" text-anchor="end">perinatal: 129 estrictos,</text><text x="238" y="500" class="f-s" text-anchor="end">decide la D12</text><text x="258" y="505" class="f-warn" text-anchor="start">pocos eventos</text><path d="M250 467 V548 H120 V669" class="f-line-warn" fill="none" marker-end="url(#ahw)"/><text x="330" y="614" class="f-band" text-anchor="start">4 · COMPROBAR Y ACTUAR</text><path d="M330 621 H1240" class="f-rule" fill="none"/><rect x="40" y="671" width="160" height="70" rx="6" class="f-feas"/><text x="52" y="699" class="f-t" text-anchor="start">Solo análisis</text><text x="52" y="714" class="f-t" text-anchor="start">de viabilidad</text><text x="52" y="730" class="f-s" text-anchor="start">muerte materna: 3 eventos</text><rect x="240" y="671" width="122" height="70" rx="6" class="f-box"/><text x="250" y="688" class="f-id" text-anchor="start">E9</text><text x="250" y="707" class="f-t" text-anchor="start">Sensibilidad</text><text x="250" y="722" class="f-t" text-anchor="start">y robustez</text><circle cx="352" cy="681" r="4.5" class="f-dot"/><path d="M420 566 V588 H301 V670" class="f-line" fill="none" marker-end="url(#ah)"/><rect x="402" y="640" width="660" height="132" rx="8" class="f-e10"/><circle cx="422" cy="660" r="4.5" class="f-dot"/><text x="432" y="664" class="f-id" text-anchor="start">E10</text><text x="466" y="664" class="f-ink" text-anchor="start">De la predicción a la estrategia de prevención</text><rect x="972" y="648" width="76" height="22" rx="11" class="f-pill"/><text x="1010" y="663" class="f-accent" text-anchor="middle">propuesta</text><rect x="416" y="680" width="204" height="34" rx="5" class="f-chip"/><text x="518" y="701" class="f-t" text-anchor="middle">Niveles de riesgo y umbrales</text><rect x="628" y="680" width="204" height="34" rx="5" class="f-chip"/><text x="730" y="701" class="f-t" text-anchor="middle">Predictores accionables</text><rect x="840" y="680" width="204" height="34" rx="5" class="f-chip"/><text x="942" y="701" class="f-t" text-anchor="middle">Subgrupos y equidad</text><rect x="416" y="724" width="204" height="34" rx="5" class="f-chip"/><text x="518" y="745" class="f-t" text-anchor="middle">Alerta con validación humana</text><rect x="628" y="724" width="204" height="34" rx="5" class="f-chip"/><text x="730" y="745" class="f-t" text-anchor="middle">Validación y recalibración local</text><rect x="840" y="724" width="204" height="34" rx="5" class="f-chip"/><text x="942" y="745" class="f-t" text-anchor="middle">Monitoreo y fecha de revisión</text><rect x="1102" y="671" width="122" height="70" rx="6" class="f-box"/><text x="1112" y="688" class="f-id" text-anchor="start">E11</text><text x="1112" y="707" class="f-t" text-anchor="start">Reporte</text><text x="1112" y="723" class="f-s" text-anchor="start">TRIPOD+AI</text><path d="M362 706 H401" class="f-line" fill="none" marker-end="url(#ah)"/><path d="M1062 706 H1101" class="f-line" fill="none" marker-end="url(#ah)"/><path d="M120 741 V796 H1163 V742" class="f-line-warn" fill="none" marker-end="url(#ahw)"/><text x="640" y="789" class="f-warn" text-anchor="middle">pocos eventos: directo al reporte, sin E8 a E10</text></g></svg>
