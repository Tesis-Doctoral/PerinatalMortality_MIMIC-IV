# Optional: use it ONLY if you do not already have the MIMIC-IV PostgreSQL container of the
# companion project (MaternalMortality_MIMIC-IV) running. Both projects use the same database;
# never run two PostgreSQL containers on the same MIMICIV_DATA_DIR.
version: '3.9'
services:
  db_mimiciv:
    image: postgres:13
    restart: always
    environment:
      POSTGRES_USER: ${MIMICIV_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${MIMICIV_DB_PASSWORD:?set MIMICIV_DB_PASSWORD in your .env file}
      POSTGRES_DB: ${MIMICIV_DB_NAME:-mimiciv}
    ports:
      - "${MIMICIV_DB_PORT:-5433}:5432"
    volumes:
      - ${MIMICIV_DATA_DIR:-./postgres_data}:/var/lib/postgresql/data
      - ${MIMICIV_CSV_DIR:-./mimic_csv}:/mimic_csv:ro

  jupyter:
    image: jupyter/base-notebook:python-3.10
    container_name: jupyter_python_perinatal
    ports:
      - "8890:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
    environment:
      - JUPYTER_ENABLE_LAB=yes
    restart: unless-stopped
